<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CW Listing Scraper — Running</title>
  <link rel="stylesheet" href="worker.css" />
</head>
<body>
  <header>
    <h1 id="run-title">CW Listing Scraper</h1>
    <div id="run-config" class="muted"></div>
  </header>

  <section id="progress-section">
    <div id="progress-bar-track">
      <div id="progress-bar-fill" style="width: 0%"></div>
    </div>
    <div id="progress-counts">0 / 0</div>
  </section>

  <section id="resume-banner" hidden>
    <p>A previous run for this search didn't finish. <button id="resume-btn">Resume</button> <button id="discard-btn">Discard &amp; start fresh</button></p>
  </section>

  <section id="results-section">
    <h2>Listings</h2>
    <table id="results-table">
      <thead>
        <tr><th>Title</th><th>Status</th><th>Brochure</th></tr>
      </thead>
      <tbody id="results-tbody"></tbody>
    </table>
  </section>

  <section id="log-section">
    <h2>Log</h2>
    <div id="log-pane"></div>
  </section>

  <section id="summary-section" hidden>
    <h2>Summary</h2>
    <div id="summary-content"></div>
  </section>

  <footer class="actions">
    <button id="download-partial-btn">Download partial results</button>
    <button id="download-final-btn" class="primary" disabled>Download Excel</button>
  </footer>

  <script src="worker.js" type="module"></script>
</body>
</html>
